<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freshers Party 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="form-box">
      <h1>🎉 Freshers Party 2026</h1>
      <p class="subtitle">Registration Form</p>

      <form id="registrationForm">
        <div class="input-group">
          <label>Student Name</label>
          <input type="text" id="studentName" required>
        </div>

        <div class="input-group">
          <label>Class</label>
          <input type="text" id="className" required>
        </div>

        <div class="input-group">
          <label>Mobile Number</label>
          <input type="tel" id="mobile" maxlength="10" pattern="[0-9]{10}" required>
        </div>

        <div class="input-group">
          <label>Event</label>
          <select id="event" required>
            <option value="">Select Event</option>
            <option>Solo Dance 💃</option>
            <option>Group Dance (Hip-Hop, Funny, Lazy, etc.) 🕺</option>
            <option>Mimicry 🎭</option>
            <option>Singing 🎤</option>
            <option>Small Act/Drama 🎬</option>
            <option>Instrumental Music 🎶</option>
            <option>Fashion Show 👗</option>
            <option>Ramp Walk 🚶</option>
            <option>Other Activities/Performances</option>
          </select>
        </div>

        <div class="input-group" id="songNameGroup" style="display: none;">
  <label>Song Name</label>
  <input
    type="text"
    id="songName"
    placeholder="Enter song/performance name"
  >

        <button type="submit">Register Now 🎉</button>
        <p id="message"></p>
      </form>

      <a class="admin-link" href="admin-login.html">Admin Login</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
