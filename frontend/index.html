<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freshers Party 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="form-box">

      <h1>🎉 Freshers Party 2026</h1>
      <p class="subtitle">Registration Form</p>

      <form id="registrationForm">

        <!-- Student Name -->
        <div class="input-group">
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" required>
        </div>

        <!-- Class -->
        <div class="input-group">
          <label for="className">Class</label>
          <input type="text" id="className" required>
        </div>

        <!-- Mobile -->
        <div class="input-group">
          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            maxlength="10"
            pattern="[0-9]{10}"
            required
          >
        </div>

        <!-- Event -->
        <div class="input-group">
          <label for="event">Event</label>

          <select id="event" required>
            <option value="">Select Event</option>

            <option value="Solo Dance 💃">
              Solo Dance 💃
            </option>

            <option value="Group Dance (Hip-Hop, Funny, Lazy, etc.) 🕺">
              Group Dance (Hip-Hop, Funny, Lazy, etc.) 🕺
            </option>

            <option value="Mimicry 🎭">
              Mimicry 🎭
            </option>

            <option value="Singing 🎤">
              Singing 🎤
            </option>

            <option value="Small Act/Drama 🎬">
              Small Act/Drama 🎬
            </option>

            <option value="Instrumental Music 🎶">
              Instrumental Music 🎶
            </option>

            <option value="Fashion Show 👗">
              Fashion Show 👗
            </option>

            <option value="Ramp Walk 🚶">
              Ramp Walk 🚶
            </option>

            <option value="Other Activities/Performances">
              Other Activities/Performances
            </option>

          </select>
        </div>

        <!-- Song Name -->
        <div
          class="input-group"
          id="songNameGroup"
          style="display: none;"
        >
          <label for="songName">Song Name</label>

          <input
            type="text"
            id="songName"
            placeholder="Enter song name"
          >
        </div>

        <!-- Register -->
        <button type="submit">
          Register Now 🎉
        </button>

        <p id="message"></p>

      </form>

      <!-- Admin Login -->
      <a class="admin-link" href="admin-login.html">
        Admin Login
      </a>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
